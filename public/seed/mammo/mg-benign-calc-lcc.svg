    <path d="M1000,110 C620,120 230,330 190,650 C230,970 620,1180 1000,1190 Z" fill="url(#fat)"/>
    <g clip-path="url(#breast)">
      <g mask="url(#gland)"><rect width="1000" height="1300" filter="url(#tissue)"/></g>
      
      <ellipse cx="488.5" cy="499.2" rx="6.7" ry="7.6" fill="#fff"/><ellipse cx="480.2" cy="496.7" rx="5.2" ry="3.3" fill="#fff"/><ellipse cx="481.0" cy="502.3" rx="8.8" ry="5.7" fill="#fff"/><ellipse cx="497.9" cy="483.1" rx="6.6" ry="6.9" fill="#fff"/><ellipse cx="512.3" cy="477.4" rx="5.8" ry="7.3" fill="#fff"/><ellipse cx="493.9" cy="480.2" rx="3.6" ry="6.7" fill="#fff"/><ellipse cx="514.7" cy="474.8" rx="4.1" ry="7.9" fill="#fff"/><ellipse cx="483.4" cy="479.0" rx="5.7" ry="3.5" fill="#fff"/><ellipse cx="483.0" cy="486.4" rx="7.6" ry="3.4" fill="#fff"/>
      <rect width="1000" height="1300" filter="url(#grain)" opacity="0.5"/>
    </g>
    <path d="M1000,110 C620,120 230,330 190,650 C230,970 620,1180 1000,1190 Z" fill="none" stroke="#6f6f6f" stroke-width="3"/>
