    </radialGradient>
    <clipPath id="breast"><path d="M1000,110 C620,120 230,330 190,650 C230,970 620,1180 1000,1190 Z"/></clipPath>
    <mask id="gland" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="1300"><path d="M1000,230 C700,240 420,400 360,650 C420,900 700,1060 1000,1070 Z" fill="#fff" filter="url(#feather)"/></mask>
  </defs>
  <rect width="1000" height="1300" fill="#000"/>
